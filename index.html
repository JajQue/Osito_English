<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osito English</title>
<meta name="theme-color" content="#2ea3e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Plan: columna tipo teléfono (máx. 480px), solo el cuerpo hace scroll, botón principal fijo abajo.
   Colores sacados del oso: cielo ártico, mejilla rosada, tinta cacao. Botones con la forma de Hormi. */
:root {
  --nieve: #ffffff;
  --hielo: #eaf6fd;
  --cielo: #2ea3e6;
  --cielo-osc: #1b7fbb;
  --mejilla: #ff8fa3;
  --mejilla-osc: #e0607a;
  --tinta: #2b2320;
  --tinta-suave: #7a6f6a;
  --borde: #d6e4ee;
  --verde: #46a944;
  --verde-osc: #2f7f2e;
  --verde-suave: #e3f4e1;
  --rojo: #e2513b;
  --rojo-osc: #b53a27;
  --rojo-suave: #fde5e0;
  --oro: #f2b632;
  --oro-osc: #c98f12;
  --gris: #e6ebef;
  --gris-osc: #c4ced6;
  --titulo: 'Baloo 2', 'Figtree', system-ui, sans-serif;
  --texto: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --lado: clamp(16px, 5vw, 22px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #cfe6f5;
  color: var(--tinta);
  font-family: var(--texto);
  font-size: 16px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--tinta); outline-offset: 2px; }

.marco {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  background: var(--nieve);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cuerpo { flex: 1; min-height: 0; overflow-y: auto; padding: 16px var(--lado) 24px; }
.pie { padding: 12px var(--lado) 16px; border-top: 2px solid var(--gris); background: var(--nieve); }
.pie.bien { background: var(--verde-suave); border-color: var(--verde-suave); }
.pie.mal { background: var(--rojo-suave); border-color: var(--rojo-suave); }

/* Botón de Hormi: redondo, con sombra dura que se hunde al tocar */
.boton {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 54px; padding: 10px 18px;
  border: 0; border-radius: 999px;
  background: var(--cielo); color: var(--nieve);
  font-weight: 800; font-size: 1.05rem; line-height: 1.15; text-align: center;
  box-shadow: 0 4px 0 var(--cielo-osc);
  transition: transform .06s, box-shadow .06s;
}
.boton:active { transform: translateY(4px); box-shadow: 0 0 0 var(--cielo-osc); }
.boton:disabled { background: var(--gris); color: #9aa6ae; box-shadow: 0 4px 0 var(--gris-osc); cursor: default; transform: none; }
.boton.claro { background: var(--nieve); color: var(--tinta); box-shadow: 0 0 0 2px var(--borde) inset, 0 4px 0 var(--borde); }
.boton.claro:active { box-shadow: 0 0 0 2px var(--borde) inset; }
.boton.verde { background: var(--verde); box-shadow: 0 4px 0 var(--verde-osc); }
.boton.verde:active { box-shadow: 0 0 0 var(--verde-osc); }
.boton.peligro { background: var(--rojo); box-shadow: 0 4px 0 var(--rojo-osc); }
.boton.peligro:active { box-shadow: 0 0 0 var(--rojo-osc); }
.boton svg { width: 24px; height: 24px; flex: none; }
.boton.chico { min-height: 44px; font-size: .95rem; width: auto; }

/* Cabecera del inicio */
.cabecera { display: flex; align-items: center; gap: 12px; padding: 12px var(--lado); border-bottom: 2px solid var(--gris); }
.cabecera img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--borde); }
.cabecera h1 { font-family: var(--titulo); font-size: 1.35rem; line-height: 1; margin: 0; flex: 1; min-width: 0; }
.dato { display: flex; align-items: center; gap: 4px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dato svg { width: 22px; height: 22px; }
.dato.racha { color: #e8792a; } .dato.xp { color: var(--oro-osc); } .dato.vidas { color: var(--rojo); }

.saludo { display: flex; align-items: center; gap: 12px; background: var(--hielo); border-radius: 22px; padding: 12px 16px 12px 8px; }
.saludo img { width: 104px; flex: none; mix-blend-mode: multiply; animation: flotar 3s ease-in-out infinite; }
.saludo h2 { font-family: var(--titulo); font-size: 1.3rem; line-height: 1.1; margin: 0 0 4px; text-wrap: balance; }
.saludo p { margin: 0; color: var(--tinta-suave); font-size: .95rem; }
.barra { height: 14px; border-radius: 99px; background: var(--gris); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 99px; background: var(--cielo); transition: width .3s; min-width: 14px; }
.meta { margin-top: 10px; }
.meta small { display: block; margin-top: 4px; font-weight: 700; color: var(--tinta-suave); font-variant-numeric: tabular-nums; }

.unidad { margin: 20px 0 6px; padding: 14px 16px; border-radius: 18px; background: var(--cielo); color: var(--nieve); box-shadow: 0 4px 0 var(--cielo-osc); }
.unidad b { display: block; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.unidad span { font-family: var(--titulo); font-size: 1.25rem; line-height: 1.1; }

.camino { display: flex; flex-direction: column; gap: 18px; padding: 18px 0 8px; }
.parada { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 150px; background: none; border: 0; padding: 0; }
.parada:nth-child(4n+1) { align-self: center; }
.parada:nth-child(4n+2) { align-self: flex-end; margin-right: 8%; }
.parada:nth-child(4n+3) { align-self: center; }
.parada:nth-child(4n+4) { align-self: flex-start; margin-left: 8%; }
.parada .bola { width: 76px; height: 68px; border-radius: 50%; display: grid; place-items: center; background: var(--cielo); box-shadow: 0 7px 0 var(--cielo-osc); color: var(--nieve); transition: transform .06s, box-shadow .06s; }
.parada:active .bola { transform: translateY(7px); box-shadow: 0 0 0 var(--cielo-osc); }
.parada .bola svg { width: 32px; height: 32px; }
.parada.hecha .bola { background: var(--oro); box-shadow: 0 7px 0 var(--oro-osc); }
.parada.cerrada .bola { background: var(--gris); box-shadow: 0 7px 0 var(--gris-osc); color: #9aa6ae; }
.parada.cerrada { cursor: default; }
.parada.cerrada:active .bola { transform: none; box-shadow: 0 7px 0 var(--gris-osc); }
.parada .nombre { font-weight: 800; text-align: center; line-height: 1.15; }
.parada .sub { font-size: .82rem; color: var(--tinta-suave); font-weight: 700; margin-top: -6px; }
.parada.actual .bola { animation: latir 1.6s ease-in-out infinite; }
.globo { background: var(--nieve); border: 2px solid var(--borde); border-radius: 12px; padding: 4px 12px; font-weight: 800; color: var(--cielo-osc); font-size: .85rem; letter-spacing: .05em; }
.enlace { background: none; border: 0; color: var(--tinta-suave); text-decoration: underline; font-weight: 700; padding: 10px; display: block; margin: 16px auto 0; }

/* Lección */
.tope { display: flex; align-items: center; gap: 12px; padding: 14px var(--lado) 6px; }
.tope .barra { flex: 1; }
.tope .barra > i { background: var(--verde); }
.cerrar { background: none; border: 0; padding: 6px; color: var(--tinta-suave); display: grid; }
.cerrar svg { width: 24px; height: 24px; }
.pregunta { font-family: var(--titulo); font-size: clamp(1.25rem, 5.5vw, 1.5rem); line-height: 1.15; margin: 8px 0 14px; text-wrap: balance; }
.escena { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 16px; }
.escena img { width: 92px; flex: none; mix-blend-mode: multiply; }
.escena img.salta { animation: saltar .5s ease; }
.escena img.tiembla { animation: temblar .4s ease; }
.burbuja { position: relative; border: 2px solid var(--borde); border-radius: 16px; padding: 12px 14px; font-weight: 700; font-size: 1.1rem; margin-bottom: 26px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; }
.altavoz { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--cielo); color: var(--nieve); display: grid; place-items: center; box-shadow: 0 3px 0 var(--cielo-osc); }
.altavoz:active { transform: translateY(3px); box-shadow: none; }
.altavoz svg { width: 24px; height: 24px; }
.altavoz.grande { width: 72px; height: 72px; border-radius: 22px; box-shadow: 0 5px 0 var(--cielo-osc); }
.altavoz.grande svg { width: 38px; height: 38px; }

.opciones { display: flex; flex-direction: column; gap: 10px; }
.opcion { text-align: left; padding: 14px 16px; min-height: 54px; border-radius: 16px; background: var(--nieve); border: 0; font-weight: 700; font-size: 1.05rem; box-shadow: 0 0 0 2px var(--borde) inset, 0 4px 0 var(--borde); overflow-wrap: anywhere; }
.opcion:active { transform: translateY(2px); }
.opcion.elegida { background: var(--hielo); color: var(--cielo-osc); box-shadow: 0 0 0 2px var(--cielo) inset, 0 4px 0 var(--cielo); }
.opcion.bien { background: var(--verde-suave); color: var(--verde-osc); box-shadow: 0 0 0 2px var(--verde) inset, 0 4px 0 var(--verde); }
.opcion.mal { background: var(--rojo-suave); color: var(--rojo-osc); box-shadow: 0 0 0 2px var(--rojo) inset, 0 4px 0 var(--rojo); }
.opcion.ida { visibility: hidden; }

.renglon { min-height: 64px; border-bottom: 2px solid var(--gris); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 6px 0 12px; margin-bottom: 18px; }
.banco { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.ficha { padding: 10px 14px; border-radius: 14px; border: 0; background: var(--nieve); font-weight: 700; font-size: 1.05rem; box-shadow: 0 0 0 2px var(--borde) inset, 0 3px 0 var(--borde); }
.ficha.usada { background: var(--gris); color: transparent; box-shadow: none; pointer-events: none; }

.pares { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pares .opcion { text-align: center; }

.campo { width: 100%; font: inherit; font-size: 1.15rem; font-weight: 700; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--borde); background: var(--hielo); color: var(--tinta); }

.tip { background: var(--hielo); border-radius: 20px; padding: 16px; }
.tip p { margin: 0 0 12px; max-width: 60ch; }
.tabla { display: grid; gap: 8px; }
.tabla div { display: flex; align-items: center; gap: 10px; background: var(--nieve); border-radius: 14px; padding: 8px 10px; }
.tabla b { flex: 1; font-size: 1.05rem; }
.tabla span { flex: 1; color: var(--tinta-suave); font-weight: 700; }
.etiqueta { display: inline-block; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mejilla-osc); margin-bottom: 2px; }

.veredicto { font-family: var(--titulo); font-size: 1.2rem; margin: 0 0 2px; }
.pie.bien .veredicto { color: var(--verde-osc); } .pie.mal .veredicto { color: var(--rojo-osc); }
.correcta { margin: 0 0 10px; font-weight: 700; overflow-wrap: anywhere; }

.final { text-align: center; padding-top: 12px; }
.final img { width: min(60%, 230px); mix-blend-mode: multiply; animation: saltar .7s ease 2; }
.final h2 { font-family: var(--titulo); font-size: 1.7rem; margin: 6px 0; text-wrap: balance; }
.final p { color: var(--tinta-suave); margin: 0 auto 16px; max-width: 32ch; }
.premios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.premio { border-radius: 16px; padding: 3px; background: var(--oro); color: var(--nieve); font-weight: 800; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; }
.premio:nth-child(2) { background: var(--verde); } .premio:nth-child(3) { background: var(--mejilla-osc); }
.premio div { background: var(--nieve); color: var(--tinta); border-radius: 13px; margin-top: 3px; padding: 10px 4px; font-size: 1.2rem; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }

.boton.rosa { background: var(--mejilla-osc); box-shadow: 0 4px 0 #b9435c; margin-top: 14px; }
.boton.rosa:active { box-shadow: 0 0 0 #b9435c; }
.nivel { display: flex; align-items: center; gap: 10px; margin: 28px 0 0; }
.nivel b { background: var(--tinta); color: var(--nieve); border-radius: 8px; padding: 2px 9px; font-size: .85rem; }
.nivel span { font-family: var(--titulo); font-size: 1.2rem; }
.pronto { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--gris); color: #63707a; font-weight: 700; margin-top: 8px; }
.pronto svg { width: 20px; height: 20px; flex: none; }
.pronto i { margin-left: auto; font-style: normal; font-size: .8rem; flex: none; }

/* Inicio sin scroll: una unidad a la vista */
.cuerpo.inicio { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; padding-bottom: 10px; }
.inicio .saludo { padding: 8px 16px 8px 8px; }
.inicio .saludo img { width: 76px; }
.inicio .meta { margin-top: 6px; }
.inicio .boton.rosa { margin-top: 0; flex: none; }
.pager { display: flex; align-items: stretch; gap: 8px; }
.pager .unidad { flex: 1; min-width: 0; margin: 0; padding: 10px 14px; }
.flecha { flex: none; width: 46px; border: 0; border-radius: 16px; background: var(--nieve); color: var(--cielo-osc); box-shadow: 0 0 0 2px var(--borde) inset, 0 4px 0 var(--borde); display: grid; place-items: center; margin-bottom: 4px; }
.flecha:active { transform: translateY(4px); box-shadow: 0 0 0 2px var(--borde) inset; }
.flecha:disabled { color: #b4bfc7; box-shadow: 0 0 0 2px var(--gris) inset; transform: none; cursor: default; }
.flecha svg { width: 22px; height: 22px; }
.camino.rejilla { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 14px 6px; padding: 4px 0 0; }
.rejilla .parada { align-self: auto; margin: 0; width: 31%; gap: 10px; }
.rejilla .parada .bola { width: 66px; height: 58px; box-shadow: 0 6px 0 var(--cielo-osc); }
.rejilla .parada.hecha .bola { box-shadow: 0 6px 0 var(--oro-osc); }
.rejilla .parada.cerrada .bola { box-shadow: 0 6px 0 var(--gris-osc); }
.rejilla .parada .nombre { font-size: .9rem; }
.pista { margin: 0; text-align: center; color: var(--tinta-suave); font-weight: 700; font-size: .9rem; }
.inicio .enlace { margin: 0 auto; padding: 2px 8px; font-size: .82rem; }
@media (max-height: 640px) { .inicio .saludo img { display: none; } .inicio .saludo { padding: 8px 14px; } }

.fila-enlaces { display: flex; justify-content: center; gap: 18px; }
.inicio .fila-enlaces .enlace { margin: 0; }

/* Conversación con Osito */
.titulo-chat { flex: 1; font-family: var(--titulo); font-size: 1.2rem; margin: 0; }
.temas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tema { border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 800; font-size: .9rem; background: var(--nieve); box-shadow: 0 0 0 2px var(--borde) inset; }
.tema.activo { background: var(--hielo); color: var(--cielo-osc); box-shadow: 0 0 0 2px var(--cielo) inset; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msj { max-width: 86%; padding: 10px 14px; border-radius: 18px; font-weight: 700; overflow-wrap: anywhere; }
.msj.oso { align-self: flex-start; background: var(--hielo); border-bottom-left-radius: 6px; display: flex; gap: 10px; align-items: flex-start; }
.msj.yo { align-self: flex-end; background: var(--cielo); color: var(--nieve); border-bottom-right-radius: 6px; }
.msj small { display: block; font-weight: 500; color: var(--tinta-suave); margin-top: 2px; font-size: .9rem; }
.consejo { align-self: flex-end; max-width: 86%; background: #fff4d6; border-radius: 14px; padding: 8px 12px; font-size: .92rem; }
.consejo b { color: var(--oro-osc); }
.aviso { background: var(--hielo); border-radius: 16px; padding: 14px; color: var(--tinta-suave); font-weight: 700; }
.entrada { display: flex; gap: 8px; align-items: center; }
.entrada .campo { flex: 1; min-width: 0; padding: 12px 14px; font-size: 1.05rem; }
.redondo { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--cielo); color: var(--nieve); box-shadow: 0 4px 0 var(--cielo-osc); display: grid; place-items: center; }
.redondo:active { transform: translateY(4px); box-shadow: none; }
.redondo:disabled { background: var(--gris); color: #9aa6ae; box-shadow: 0 4px 0 var(--gris-osc); }
.redondo svg { width: 26px; height: 26px; }
.redondo.mic { background: var(--mejilla-osc); box-shadow: 0 4px 0 #b9435c; }
.redondo.mic.oyendo { background: var(--rojo); box-shadow: 0 4px 0 var(--rojo-osc); animation: latir 1s ease-in-out infinite; }

@keyframes flotar { 50% { transform: translateY(-5px); } }
@keyframes latir { 50% { transform: scale(1.06); } }
@keyframes saltar { 30% { transform: translateY(-16px) rotate(-4deg); } 60% { transform: translateY(0) rotate(3deg); } }
@keyframes temblar { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<script>

const CARA = 'cara.jpg';

const I = {

/* Contenido original. Cada lección: palabras nuevas, una regla corta de gramática y práctica. */
const BIENVENIDA = [
  { id: 'saludos', nombre: 'Saludos', sub: '8 palabras',
    palabras: ['hello','goodbye','please','thank you','yes','no','good morning','good night'],
    pasos: [

/* Arma los ejercicios de una lección compacta o de un repaso. */
function armar(l) {
  let v, f, c, tip = null;
  if (l.repaso) {
    v = mezclar(l.repaso.flatMap((x) => x.voc)).slice(0, 9);
    f = mezclar(l.repaso.flatMap((x) => x.fr)).slice(0, 5);
    c = mezclar(l.repaso.flatMap((x) => x.comp)).slice(0, 2);
  } else { v = l.voc; f = l.fr; c = l.comp; tip = { t: 'tip', titulo: l.tip[0], cuerpo: l.tip[1], ej: l.tip[2] }; }
  const otros = (x, lista, n) => mezclar(lista.filter((y) => y !== x)).slice(0, n);
  const ens = v.map((x) => x[0]), ess = v.map((x) => x[1]), frEs = f.map((x) => x[0]);
  const aIngles = (i) => ({ t: 'elige', q: `¿Cómo se dice «${v[i][1].toLowerCase()}»?`, ops: [v[i][0], ...otros(v[i][0], ens, 2)], ok: v[i][0], say: v[i][0] });
  const aEspanol = (i) => ({ t: 'elige', q: `¿Qué significa «${v[i][0]}»?`, dice: v[i][0], ops: [v[i][1], ...otros(v[i][1], ess, 2)], ok: v[i][1] });
  const ordenar = (i) => {
    const mias = f[i][1].split(' ').map((w) => w.toLowerCase());
    const resto = [...new Set(f.filter((_, k) => k !== i).flatMap((x) => x[1].split(' ')))].filter((w) => !mias.includes(w.toLowerCase()));
    return { t: 'ordena', es: f[i][0], en: f[i][1], extra: mezclar(resto).slice(0, 2) };
  };
  const escuchar = (i) => ({ t: 'escucha', en: f[i][1], ops: [f[i][0], ...otros(f[i][0], frEs, 2)], ok: f[i][0] });
  const completar = (i) => ({ t: 'elige', q: c[i][0], ops: [c[i][1], ...c[i][2]], ok: c[i][1],
    say: c[i][0].startsWith('Completa: ') ? c[i][0].slice(10).replace('___', c[i][1]).replace(/\s*\(.*\)/, '') : c[i][1] });
  const pasos = [aIngles(0), { t: 'pares', pares: v.slice(0, 4) }, aEspanol(4), ordenar(0), { t: 'pares', pares: v.slice(4, 8) }, completar(0),
    escuchar(1), { t: 'escribe', es: v[8][1], resp: [v[8][0]] }, ordenar(2), completar(1), escuchar(3), { t: 'escribe', es: f[4][0], resp: [f[4][1]] }];
  return tip ? [tip, ...pasos] : mezclar(pasos);
}

      <div class="opciones">${mezclar(p.ops).map((o) => `<button class="opcion" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (p.t === 'ordena') {
    const fichas = mezclar(p.en.split(' ').concat(p.extra || []));
    s.fichas = fichas; s.resp = [];
    centro = `<h2 class="pregunta">Escribe esto en inglés</h2>
      <div class="escena"><img src="${OSO}" alt=""><div class="burbuja">${esc(p.es)}</div></div>
      <div class="renglon" id="renglon" aria-label="Tu frase"></div>
      <div class="banco" id="banco">${fichas.map((f, k) => `<button class="ficha" data-k="${k}">${esc(f)}</button>`).join('')}</div>`;
  } else if (p.t === 'pares') {
    const izq = mezclar(p.pares.map((x) => x[0])), der = mezclar(p.pares.map((x) => x[1]));
    centro = `<h2 class="pregunta">Une cada palabra con su significado</h2>
      <div class="pares">${izq.map((a, k) => `<button class="opcion" data-lado="en" data-v="${esc(a)}">${esc(a)}</button><button class="opcion" data-lado="es" data-v="${esc(der[k])}">${esc(der[k])}</button>`).join('')}</div>`;
  } else if (p.t === 'escribe') {
    centro = `<h2 class="pregunta">Escribe esto en inglés</h2>
      <div class="escena"><img src="${OSO}" alt=""><div class="burbuja">${esc(p.es)}</div></div>
      <label for="campo" class="etiqueta">Tu respuesta</label>
      <input class="campo" id="campo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe en inglés">`;
  }
  app.innerHTML = `
    <div class="tope">
      <button class="cerrar" id="salir" aria-label="Salir de la lección">${I.x}</button>
      <div class="barra"><i style="width:${Math.max(4, s.hechos / s.total * 100)}%"></i></div>
      <span class="dato vidas">${I.corazon}${s.vidas}</span>
    </div>
    <main class="cuerpo">${centro}</main>
    <footer class="pie" id="pie"><button class="boton ${p.t === 'tip' ? '' : 'verde'}" id="accion" ${p.t === 'tip' ? '' : 'disabled'}>${p.t === 'tip' ? 'Entendido' : 'Comprobar'}</button></footer>`;

  const accion = app.querySelector('#accion');
  app.querySelector('#salir').onclick = inicio;
  app.querySelectorAll('[data-say]').forEach((b) => b.onclick = () => decir(b.dataset.say));
  accion.onclick = () => (p.t === 'tip' ? avanzar(true, true) : comprobar());

  if (p.t === 'elige' || p.t === 'escucha') {
    app.querySelectorAll('.opcion').forEach((b) => b.onclick = () => {
      if (s.estado !== 'pensando') return;
      app.querySelectorAll('.opcion').forEach((x) => x.classList.remove('elegida'));
      b.classList.add('elegida'); s.resp = b.dataset.v; accion.disabled = false;
    });
  }
  if (p.t === 'ordena') {
    const renglon = app.querySelector('#renglon'), banco = app.querySelector('#banco');
    const pintar = () => {
      renglon.innerHTML = s.resp.map((k) => `<button class="ficha" data-k="${k}">${esc(s.fichas[k])}</button>`).join('');
      banco.querySelectorAll('.ficha').forEach((b) => b.classList.toggle('usada', s.resp.includes(+b.dataset.k)));
      renglon.querySelectorAll('.ficha').forEach((b) => b.onclick = () => { if (s.estado !== 'pensando') return; s.resp = s.resp.filter((k) => k !== +b.dataset.k); pintar(); });
      accion.disabled = !s.resp.length;
    };
    banco.querySelectorAll('.ficha').forEach((b) => b.onclick = () => { if (s.estado !== 'pensando') return; s.resp.push(+b.dataset.k); pintar(); });
  }
  if (p.t === 'pares') {
    let sel = null, faltan = p.pares.length, tropiezos = 0;
    app.querySelector('#pie').hidden = true;
    app.querySelectorAll('.pares .opcion').forEach((b) => b.onclick = () => {
      if (b.classList.contains('bien')) return;
      if (b.dataset.lado === 'en') decir(b.dataset.v);
      if (!sel || sel.dataset.lado === b.dataset.lado) { if (sel) sel.classList.remove('elegida'); sel = b; b.classList.add('elegida'); return; }
      const en = b.dataset.lado === 'en' ? b : sel, es = b.dataset.lado === 'es' ? b : sel;
      const ok = p.pares.some((x) => x[0] === en.dataset.v && x[1] === es.dataset.v);
      sel.classList.remove('elegida');
      if (ok) { en.classList.add('bien'); es.classList.add('bien'); faltan--; if (!faltan) veredicto(tropiezos === 0, '', true); }
      else { tropiezos++; const a = sel; [a, b].forEach((x) => x.classList.add('mal')); setTimeout(() => [a, b].forEach((x) => x.classList.remove('mal')), 500); }
      sel = null;
    });
  }
  if (p.t === 'escribe') {
    const campo = app.querySelector('#campo');
    campo.oninput = () => { s.resp = campo.value; accion.disabled = !campo.value.trim(); };
    campo.focus();
  }
}

function comprobar() {
  const s = ses, p = s.cola[0];
  let ok = false, buena = '';
  if (p.t === 'elige' || p.t === 'escucha') {
    ok = s.resp === p.ok; buena = p.t === "escucha" && p.en !== p.ok ? p.en + " = " + p.ok : p.ok;
    app.querySelectorAll('.opcion').forEach((b) => { if (b.dataset.v === p.ok) b.classList.add('bien'); else if (b.dataset.v === s.resp) b.classList.add('mal'); b.classList.remove('elegida'); });
    if (ok && p.say) decir(p.say);
  } else if (p.t === 'ordena') {
    ok = limpio(s.resp.map((k) => s.fichas[k]).join(' ')) === limpio(p.en); buena = p.en; if (ok) decir(p.en);
  } else if (p.t === 'escribe') {
    ok = p.resp.map(limpio).includes(limpio(s.resp || '')); buena = p.resp[0]; app.querySelector('#campo').disabled = true; if (ok) decir(p.resp[0]);
  }
  veredicto(ok, buena, false);
}

function veredicto(ok, buena, sinCastigo) {
  const s = ses;
  s.estado = 'visto';
  const pie = app.querySelector('#pie');
  pie.hidden = false;
  const fallo = !ok && !sinCastigo;
  if (fallo) s.vidas--;
  pie.className = 'pie ' + (fallo ? 'mal' : 'bien');
  const frases = ['¡Muy bien!', 'Great job!', '¡Correcto!', 'Well done!'];
  pie.innerHTML = `<p class="veredicto">${fallo ? 'Casi. Lo repasamos al final.' : frases[s.hechos % frases.length]}</p>
    ${fallo && buena ? `<p class="correcta">Respuesta correcta: ${esc(buena)}</p>` : ''}
    <button class="boton ${fallo ? 'peligro' : 'verde'}" id="seguir">Continuar</button>`;
  const oso = app.querySelector('.escena img');
  if (oso) oso.classList.add(fallo ? 'tiembla' : 'salta');
  const v = app.querySelector('.vidas'); if (v) v.innerHTML = I.corazon + s.vidas;
  const seguir = pie.querySelector('#seguir');
  seguir.onclick = () => avanzar(!fallo, false);
  seguir.focus();
}

function avanzar(ok, esTip) {
  const s = ses, p = s.cola.shift();
  if (ok) { s.hechos++; if (!esTip && !p.repetido) s.primeras++; }
  else { s.fallos++; p.repetido = true; s.cola.push(p); }
  if (s.vidas <= 0) return sinVidas();
  paso();
}

function sinVidas() {
  app.innerHTML = `<main class="cuerpo final">
      <img src="${OSO}" alt="" style="animation:none;filter:grayscale(.4)">
      <h2>Te quedaste sin corazones</h2>
      <p>No pasa nada. Equivocarse es parte de aprender. Vuelve a intentarlo y verás que ya recuerdas más.</p>
    </main>
    <footer class="pie"><button class="boton" id="otra">Intentar otra vez</button><button class="enlace" id="volver">Volver al inicio</button></footer>`;
  const i = LECCIONES.indexOf(ses.l);
  app.querySelector('#otra').onclick = () => empezar(i);
  app.querySelector('#volver').onclick = inicio;
}

function final() {
  const s = ses, nueva = !est.hechas[s.l.id];
  const preguntas = s.total - s.tips; verU = null;
  const precision = Math.round(s.primeras / preguntas * 100);
  const puntos = 10 + (s.fallos === 0 ? 5 : 0);
  est.xp += puntos; est.hechas[s.l.id] = true;
  if (est.ultimo !== dia(0)) { est.racha = est.ultimo === dia(1) ? est.racha + 1 : 1; est.ultimo = dia(0); }
  guardar();
  app.innerHTML = `<main class="cuerpo final">
      <img src="${OSO}" alt="Osito celebra">
      <h2>${s.fallos === 0 ? '¡Lección perfecta!' : '¡Lección completa!'}</h2>
      <p>${nueva && s.l.palabras.length ? `Aprendiste ${s.l.palabras.length} palabras nuevas. Ya llevas ${palabrasAprendidas()} de ${META}.` : 'Repasar es lo que hace que no se te olvide.'}</p>
      <div class="premios">
        <div class="premio">Puntos<div>+${puntos}</div></div>
        <div class="premio">Precisión<div>${precision}%</div></div>
        <div class="premio">Racha<div>${est.racha} ${est.racha === 1 ? 'día' : 'días'}</div></div>
      </div>
    </main>
    <footer class="pie"><button class="boton" id="listo">Continuar</button></footer>`;
  app.querySelector('#listo').onclick = inicio;
  app.querySelector('#listo').focus();
}

/* ---------- Conversación con Osito (el servidor habla con Gemini; la clave nunca llega aquí) ---------- */
const TEMAS = [
  { id: 'presentate', nombre: 'Preséntate', guia: 'saludos, decir tu nombre y cómo estás', en: 'Hello! I am Osito. What is your name?', es: '¡Hola! Soy Osito. ¿Cómo te llamas?' },
  { id: 'gustos', nombre: 'Lo que te gusta', guia: 'cosas que te gusta comer, tomar o leer', en: 'Hi! I like apples. What do you like?', es: '¡Hola! Me gustan las manzanas. ¿Qué te gusta a ti?' },
  { id: 'dia', nombre: 'Tu día', guia: 'qué tienes y qué quieres hoy: trabajo, tiempo, comida', en: 'Good morning! Do you have work today?', es: '¡Buenos días! ¿Tienes trabajo hoy?' }
];
let chat = null;
function nuevoChat(k) { const t = TEMAS[k]; chat = { k, msgs: [{ de: 'oso', en: t.en, es: t.es }], ocupado: false, borrador: '', error: '' }; }

function hablar() {
  ses = null; vista = 'hablar';
  if (!chat) nuevoChat(0);
  const c = chat;
  app.innerHTML = `
    <div class="tope">
      <button class="cerrar" id="salir" aria-label="Volver al inicio">${I.x}</button>
      <h1 class="titulo-chat">Habla con Osito</h1>
    </div>
    <main class="cuerpo" id="hilo">
      <div class="temas">${TEMAS.map((t, k) => `<button class="tema ${k === c.k ? 'activo' : ''}" data-k="${k}">${t.nombre}</button>`).join('')}</div>
      <div class="chat">
        ${c.msgs.map((m) => m.de === 'yo'
          ? `<div class="msj yo">${esc(m.t)}</div>${m.tip ? `<div class="consejo"><b>Mejor así:</b> ${esc(m.tip)}</div>` : ''}`
          : `<div class="msj oso">${hayVoz() ? `<button class="altavoz" data-say="${esc(m.en)}" aria-label="Escuchar a Osito">${I.voz}</button>` : ''}<div>${esc(m.en)}<small>${esc(m.es || '')}</small></div></div>`).join('')}
        ${c.ocupado ? '<div class="msj oso"><div>Osito está pensando…</div></div>' : ''}
        ${c.error ? `<div class="aviso">${esc(c.error)}</div>` : ''}
      </div>
    </main>
    <footer class="pie"><div class="entrada">
      ${DICT ? `<button class="redondo mic ${oyendo ? 'oyendo' : ''}" id="mic" aria-label="${oyendo ? 'Dejar de escuchar' : 'Hablar por el micrófono'}">${I.mic}</button>` : ''}
      <input class="campo" id="texto" autocomplete="off" placeholder="${DICT ? 'Habla o escribe en inglés' : 'Escribe en inglés'}" aria-label="Tu mensaje" ${IA ? '' : 'disabled'}>
      <button class="redondo" id="mandar" aria-label="Enviar" ${IA && !c.ocupado ? '' : 'disabled'}>${I.enviar}</button>
    </div></footer>`;
  const texto = app.querySelector('#texto'), hilo = app.querySelector('#hilo');
  texto.value = c.borrador;
  hilo.scrollTop = hilo.scrollHeight;
  texto.oninput = () => { c.borrador = texto.value; };
  app.querySelector('#salir').onclick = () => { if (DICT && oyendo) DICT.stop().catch(() => {}); inicio(); };
  app.querySelectorAll('.tema').forEach((b) => b.onclick = () => { if (!c.ocupado) { nuevoChat(+b.dataset.k); hablar(); } });
  app.querySelectorAll('[data-say]').forEach((b) => b.onclick = () => decir(b.dataset.say));
  app.querySelector('#mandar').onclick = mandar;
  const mic = app.querySelector('#mic');
  if (mic) mic.onclick = () => {
    if (oyendo) { DICT.stop().catch(() => {}); return; }
    DICT.start().catch((e) => { if (e && e.code === 'not_granted') { DICT = null; hablar(); } });
  };
}

async function mandar() {
  const c = chat, t = (c.borrador || '').trim();
  if (!t || !IA || c.ocupado) return;
  if (DICT && oyendo) DICT.stop().catch(() => {});
  const mio = { de: 'yo', t };
  c.msgs.push(mio); c.borrador = ''; c.ocupado = true; c.error = '';
  hablar();
  try {
    const u = UNIDADES.find((x) => x.lecciones && x.lecciones.includes(LECCIONES[Math.min(pendiente(), LECCIONES.length - 1)]));
    const { data, error } = await sb.functions.invoke('osito', { body: { tema: TEMAS[c.k].id, nivel: u ? u.nivel : 'A1', mensajes: c.msgs.map((m) => ({ de: m.de, t: m.de === 'yo' ? m.t : m.en })) } });
    if (error) { let motivo = ''; try { motivo = (await error.context.json()).error; } catch (e2) {} throw { code: motivo || 'red' }; }
    const r = data;
    if (!r || typeof r.en !== 'string') throw new Error('formato');
    if (r.tip) mio.tip = String(r.tip);
    c.msgs.push({ de: 'oso', en: r.en, es: typeof r.es === 'string' ? r.es : '' });
    if (est.ultimo !== dia(0)) { est.racha = est.ultimo === dia(1) ? est.racha + 1 : 1; est.ultimo = dia(0); }
    est.xp += 2; guardar();
    decir(r.en);
  } catch (e) {
    c.msgs.pop(); c.borrador = t;
    const MOTIVOS = {
      limite_diario: 'Ya usaste tus 60 mensajes de hoy. Mañana seguimos practicando.',
      descanso: 'Osito necesita un descanso. Intenta de nuevo en un minuto.',
      no_permitido: 'Tu correo no está en la lista de Osito English.',
      falta_clave: 'Falta terminar de configurar la conversación en el servidor.',
      red: 'No hay conexión. Revisa tu internet e intenta otra vez.' };
    c.error = MOTIVOS[e && e.code] || 'Osito no pudo responder. Toca enviar para intentar otra vez.';
  }
  c.ocupado = false;
  if (vista === 'hablar') hablar();
}

/* Micrófono: reconocimiento de voz del navegador (Chrome y Android). Donde no existe, se escribe. */
const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Reconocedor) {
  const rec = new Reconocedor(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false;
  let base = '';
  const pintarMic = () => { const m = app.querySelector('#mic'); if (m) m.classList.toggle('oyendo', oyendo); };
  rec.onstart = () => { oyendo = true; base = chat ? chat.borrador : ''; pintarMic(); };
  rec.onend = () => { oyendo = false; pintarMic(); };
  rec.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { DICT = null; if (vista === 'hablar') hablar(); } };
  rec.onresult = (e) => {
    let dicho = ''; for (const r of e.results) dicho += r[0].transcript;
    if (!chat) return;
    chat.borrador = (base + ' ' + dicho).trim();
    const c = vista === 'hablar' ? app.querySelector('#texto') : null; if (c) c.value = chat.borrador;
  };
  DICT = {
    start: () => { try { rec.start(); } catch (e) {} return Promise.resolve(); },
    stop: () => { try { rec.stop(); } catch (e) {} return Promise.resolve(); } };
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && vista === 'hablar') { if (document.activeElement && document.activeElement.id === 'texto') { e.preventDefault(); mandar(); } return; }
  if (e.key !== 'Enter' || !ses) return;
  const b = app.querySelector('#seguir') || app.querySelector('#accion');
  if (b && !b.disabled && document.activeElement !== b) { e.preventDefault(); b.click(); }
});

/* ---------- Entrada con Google ---------- */
function pantallaEntrar(mensaje) {
  ses = null; vista = 'entrar';
  app.innerHTML = `<main class="cuerpo final">
      <img src="${OSO}" alt="Osito saluda con los brazos abiertos" style="animation:flotar 3s ease-in-out infinite">
      <h2>Osito English</h2>
      <p>Aprende inglés conmigo, 5 minutos al día.</p>
      ${mensaje ? `<div class="aviso">${esc(mensaje)}</div>` : ''}
    </main>
    <footer class="pie"><button class="boton" id="google">Entrar con Google</button><p class="pista" style="margin-top:10px">Solo para personas invitadas.</p></footer>`;
  app.querySelector('#google').onclick = () => {
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } })
      .then((r) => { if (r && r.error) pantallaEntrar('No se pudo abrir Google. Intenta otra vez.'); }, () => pantallaEntrar('No se pudo abrir Google. Intenta otra vez.'));
  };
}

function pantallaSinPermiso(correo) {
  ses = null; vista = 'entrar';
  app.innerHTML = `<main class="cuerpo final">
      <img src="${OSO}" alt="" style="animation:none">
      <h2>Todavía no estás en la lista</h2>
      <p>El correo ${esc(correo)} no tiene invitación. Pide a quien te invitó que lo agregue.</p>
    </main>
    <footer class="pie"><button class="boton claro" id="otra-cuenta">Entrar con otra cuenta</button></footer>`;
  app.querySelector('#otra-cuenta').onclick = () => sb.auth.signOut();
}

async function entrar(sesion) {
  usuario = sesion.user;
  app.innerHTML = '<main class="cuerpo final"><p style="margin-top:40%">Abriendo tu progreso…</p></main>';
  let permitido = true, nube = null;
  try {
    const r = await sb.rpc('puedo_entrar');
    if (!r.error) permitido = r.data === true;
    if (permitido) { const f = await sb.from('progreso').select('datos').eq('usuario_id', usuario.id).maybeSingle(); if (!f.error && f.data) nube = f.data.datos; }
  } catch (e) {}
  if (!permitido) { const correo = usuario.email || ''; usuario = null; return pantallaSinPermiso(correo); }
  let local = null;
  try { local = JSON.parse(localStorage.getItem(claveLocal())); } catch (e) {}
  est = VACIO();
  // Si hay progreso en este teléfono y en la nube, se queda con el más avanzado y junta las lecciones hechas.
  const fuentes = [local, nube].filter((x) => x && typeof x === 'object');
  for (const f of fuentes) {
    Object.assign(est.hechas, f.hechas || {});
    if ((f.xp || 0) >= est.xp) { est.xp = f.xp || 0; est.racha = f.racha || 0; est.ultimo = f.ultimo || ''; }
  }
  guardar();
  IA = {}; chat = null; verU = null;
  inicio();
}

async function arrancar() {
  if (!window.supabase) { app.innerHTML = '<main class="cuerpo"><div class="aviso">No se pudo cargar la app. Recarga la página.</div></main>'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_CLAVE_PUBLICA);
  sb.auth.onAuthStateChange((evento, sesion) => {
    // Nunca se llama a Supabase dentro de este aviso: se deja para el siguiente turno.
    setTimeout(() => {
      if (evento === 'SIGNED_OUT') { usuario = null; IA = null; est = VACIO(); chat = null; pantallaEntrar(); }
      else if (sesion && (!usuario || usuario.id !== sesion.user.id)) entrar(sesion);
    }, 0);
  });
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) pantallaEntrar();
}
arrancar();
</script>
